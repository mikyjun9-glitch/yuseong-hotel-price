name: 야놀자 호텔 가격 확인

on:
  schedule:
    # 한국시간 오전 10:00 ~ 오후 11:30 자동실행
    # 30분마다 실행
     - cron: "0,30 1-14 * * *"
     - cron: "50 14 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-price:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run hotel price checker
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: python main.py

      - name: Save latest prices
        run: |
          git config user.name "hotel-price-bot"
          git config user.email "hotel-price-bot@users.noreply.github.com"

          git add prices.json

          if git diff --cached --quiet; then
            echo "가격 변경 없음"
          else
            git commit -m "Update hotel prices"
            git push
          fi
